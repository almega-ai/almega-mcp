[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "almega-mcp"
version = "0.2.0"
description = "The immutable delegation frame for AI agents — set boundaries once, agents run free inside them, sensitive actions need one-click human approval, all logged. MCP-native, open source."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Almega" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "agent-governance",
    "agent-control",
    "guardrails",
    "human-in-the-loop",
    "approval",
    "audit",
    "mcp-security",
    "payments",
    "stripe",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "stripe>=11.0.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://alemgaai.netlify.app"
Repository = "https://github.com/almega-ai/almega-mcp"
Issues = "https://github.com/almega-ai/almega-mcp/issues"

[project.scripts]
almega-mcp = "almega_gate:main"
almega-wallet = "almega_mcp:main"

[tool.setuptools]
py-modules = ["almega_gate", "almega_gateway", "almega_proxy", "almega_mcp"]
